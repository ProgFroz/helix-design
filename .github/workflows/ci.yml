name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      # Frozen v0.1 reference of the hand-written report theme (check 8).
      HELIX_DESIGN_REFERENCE: scripts/fixtures/pantheon-report.reference.css
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build-storybook
